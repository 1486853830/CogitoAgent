appId: com.cogito.agent
productName: CogitoAgent
directories:
  output: dist
  buildResources: electron/assets
files:
  - electron/**/*
  - src/**/*
  - plugins/**/*
  - workflows/**/*
  - personas/**/*
  - package.json
  - .env.example
# Agent 子进程以 process.resourcesPath 为 cwd 运行（src/index.ts、插件、人设、
# node_modules 均需物理存在于磁盘而非 asar 内），故通过 extraResources 完整外置。
extraResources:
  - from: src/
    to: src
  - from: electron/shared/
    to: electron/shared
  - from: electron/assets/
    to: electron/assets
  - from: plugins/
    to: plugins
  - from: workflows/
    to: workflows
  - from: personas/
    to: personas
  - from: node_modules/
    to: node_modules
    filter:
      - '**/*'
      # === 开发工具 — 运行时不需要，排除可显著减少复制量（提速打包） ===
      - '!electron/**'
      - '!@electron/**'
      - '!electron-builder/**'
      - '!electron-builder-*/**'
      - '!electron-*/**'
      - '!typescript/**'
      - '!typescript-eslint/**'
      - '!eslint/**'
      - '!eslint-*/**'
      - '!jest/**'
      - '!@jest/**'
      - '!ts-jest/**'
      - '!prettier/**'
      - '!husky/**'
      - '!lint-staged/**'
      - '!cross-env/**'
      - '!babel-*/**'
      - '!@babel/**'
      - '!@eslint/**'
      - '!@types/**'
      - '!@typescript-eslint/**'
      # === isolated-vm：Electron ABI 不兼容 (npmRebuild: false)，运行时自动降级 ===
      - '!isolated-vm/**'
      # === 包内开发/文档/测试产物 ===
      - '!**/*.map'
      - '!**/*.ts'
      - '!**/*.md'
      - '!**/CHANGELOG*'
      - '!**/LICENSE*'
      - '!**/package-lock.json'
      - '!**/tests/**'
      - '!**/test/**'
      - '!**/__tests__/**'
      - '!**/docs/**'
      - '!**/example/**'
      - '!**/examples/**'
      - '!**/benchmark/**'
      - '!**/coverage/**'
      - '!**/.bin/**'
      - '!**/tsconfig*.json'
win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win32-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CogitoAgent
asar: true
# 说明：isolated-vm 对 Windows + Electron ABI 不兼容（官方 issue #132/#383，#272 起
# 未修复）。打包版不按 Electron ABI 重建 native，避免 electron-builder 的
# @electron/rebuild 触发编译失败；桌面版代码执行走 sandbox 降级路径（见 sandbox.ts）。
# Docker/服务器（纯 Node）环境仍直接使用 isolated-vm 强隔离沙箱。
npmRebuild: false
# normal 压缩：打包速度远快于 maximum（体积约增大 5-10%）。
# 追求最小体积时可临时改回 maximum。
compression: normal
publish:
  provider: generic
  url: ''

# 注意：生产分发建议启用代码签名（code signing），以消除 Windows SmartScreen /
# macOS Gatekeeper 警告。可通过 win.certificateFile / mac.identity 等字段配置。
# 详见 https://www.electron.build/code-signing

name: ✨ 功能建议 / Feature Request
description: 为 CogitoAgent 提出一个新想法或功能建议
title: '[Feature] '
labels: ['enhancement']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢你的建议！
        你的想法对 CogitoAgent 的发展至关重要。

  - type: dropdown
    id: category
    attributes:
      label: 功能分类 / Category
      description: 这个功能属于哪个领域？
      options:
        - 工具模块 / Tool Module（新工具或工具增强）
        - Agent 核心 / Agent Core（思考循环、状态管理、记忆等）
        - 界面 / UI（Dashboard、Desktop、Monitor 等）
        - 集成 / Integration（MCP、微信、插件等）
        - 安全 / Security（沙箱、权限、审计等）
        - 性能 / Performance（优化、资源占用等）
        - 文档 / Documentation
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 相关痛点 / Related Problem
      description: 这个功能解决了什么问题？请清晰描述
      placeholder: '当...时，我感到困扰，因为...'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你希望如何解决这个问题？描述你期望的行为
      placeholder: '我希望 CogitoAgent 能够...'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives Considered
      description: 你考虑过哪些替代方案？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充上下文 / Additional Context
      description: 添加任何其他上下文、截图或示例
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 自查清单 / Self-Check
      options:
        - label: 我已搜索现有 Issues，未找到相同建议 / I have searched existing issues and found no duplicates
          required: true
        - label: 这个功能对项目的定位（本地优先、隐私安全）保持一致 / This feature aligns with the project's vision (local-first, privacy-focused)
          required: false

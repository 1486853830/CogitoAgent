name: CogitoAgent CI/CD

on:
  push:
    branches: [main, project, develop]
  pull_request:
    branches: [main, project, develop]
  release:
    types: [created]
  workflow_dispatch:

env:
  NODE_VERSION: 24.x
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild isolated-vm

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Syntax check
        run: |
          npx tsc --noEmit
          node --check electron/main.js
          node --check electron/preload.cjs

      - name: ESLint
        run: npm run lint

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild isolated-vm

      - name: Run unit tests
        run: npm test

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/project'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (test)
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true

      - name: Build and push Docker image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cogitoagent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cogitoagent:${{ github.sha }}

  build-desktop:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/project' || contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Apply patch-package (Electron 42 / V8 14 compat)
        run: npx patch-package

      - name: Try rebuild isolated-vm (continue on error)
        run: npm rebuild isolated-vm --target_platform=win32 --target_arch=x64 2>&1 || echo "isolated-vm 编译失败，将在运行时降级到原生 vm"
        continue-on-error: true

      - name: Install electron-builder
        run: npm install electron-builder --save-dev

      - name: Build Windows installer
        run: npm run build:nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4.3.0
        with:
          name: CogitoAgent-Windows
          path: dist/*.exe
          if-no-files-found: error

  cli-test:
    name: CLI Integration Test
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild isolated-vm

      - name: CLI startup test
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          timeout 30s env CLI_MODE=true DISABLE_WS=true API_KEY="${{ secrets.API_KEY }}" npx tsx src/index.ts <<< "你好" || exit 0
        continue-on-error: true

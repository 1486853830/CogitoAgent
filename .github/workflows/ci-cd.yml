name: CogitoAgent CI/CD

on:
  push:
    branches: [ main, project, develop ]
  pull_request:
    branches: [ main, project, develop ]
  release:
    types: [ created ]
  workflow_dispatch:

env:
  NODE_VERSION: 22.x

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild isolated-vm

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/agent/Agent.js
          node --check src/agent/session.js
          node --check src/agent/registry.js
          node --check src/agent/tools/vision.js
          node --check electron/main.js
          node --check electron/preload.cjs

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild isolated-vm

      - name: Run unit tests
        run: npm test
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/project'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cogitoagent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cogitoagent:${{ github.sha }}

  build-desktop:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/project' || contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild isolated-vm --target_platform=win32 --target_arch=x64

      - name: Install electron-builder
        run: npm install electron-builder --save-dev

      - name: Build Windows installer
        run: npm run build:nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CogitoAgent-Windows
          path: dist/*.exe
          if-no-files-found: error

  cli-test:
    name: CLI Integration Test
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.API_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild isolated-vm

      - name: CLI startup test
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          timeout 30s env CLI_MODE=true DISABLE_WS=true API_KEY="${{ secrets.API_KEY }}" node src/index.js <<< "你好" || exit 0
        continue-on-error: true
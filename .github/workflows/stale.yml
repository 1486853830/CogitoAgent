# Mark Stale Issues and PRs / 标记僵尸 Issue 和 PR
#
# Automatically marks inactive issues and PRs as stale, then closes them.
# 自动将长期不活跃的 Issue 和 PR 标记为僵尸，然后关闭。
# Runs daily at 1:30 AM UTC / 每天 UTC 时间 1:30 运行

name: Mark Stale Issues and PRs / 标记僵尸 Issue 和 PR

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # --- Issues / Issue 配置 ---
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            此 Issue 因长期无活动已被自动标记为僵尸。

            If this issue is still relevant, please leave a comment or update it. Otherwise, it will be closed in 14 days.
            如果该 Issue 仍然相关，请留言或更新。否则将在 14 天后自动关闭。

            Thank you for your contribution! / 感谢你的贡献！
          close-issue-message: |
            This issue has been automatically closed due to inactivity. Feel free to reopen if it's still relevant.
            此 Issue 因长期无活动已被自动关闭。如果仍然相关，欢迎重新打开。
          stale-issue-label: 'status: stale'
          days-before-issue-stale: 90
          days-before-issue-close: 14
          # These labels exempt issues from being marked stale / 以下标签的 Issue 不会被标记为僵尸
          exempt-issue-labels: 'status: confirmed,bug,enhancement,good first issue,help wanted,security'

          # --- PRs / PR 配置 ---
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.
            此 Pull Request 因长期无活动已被自动标记为僵尸。

            If this PR is still work in progress, please update it. Otherwise, it will be closed in 14 days.
            如果该 PR 仍在进行中，请更新。否则将在 14 天后自动关闭。
          close-pr-message: |
            This pull request has been automatically closed due to inactivity. Feel free to reopen if you plan to continue working on it.
            此 Pull Request 因长期无活动已被自动关闭。如果你计划继续工作，欢迎重新打开。
          stale-pr-label: 'status: stale'
          days-before-pr-stale: 30
          days-before-pr-close: 14
          # These labels exempt PRs from being marked stale / 以下标签的 PR 不会被标记为僵尸
          exempt-pr-labels: 'dependencies,status: blocked,WIP'

          # --- General / 通用配置 ---
          operations-per-run: 100
          remove-stale-when-updated: true

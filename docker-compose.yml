version: '3.8'

services:
  cogito-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cogito-agent
    restart: unless-stopped
    ports:
      - "9527:9527"
    environment:
      - NODE_ENV=production
      - THINKING_INTERVAL=3000
      # API 配置（通过环境变量或配置文件设置）
      - COGITO_API_KEY=${COGITO_API_KEY}
      - COGITO_API_BASE_URL=${COGITO_API_BASE_URL:-https://api.openai.com/v1}
      - COGITO_MODEL=${COGITO_MODEL:-gpt-4o}
      - COGITO_WORKSPACE=/app/workspace
    volumes:
      # 持久化配置
      - ./config.json:/app/config.json:ro
      # 持久化数据
      - cogito-data:/app/data
      # 工作区（可选，映射本地目录）
      - ${COGITO_WORKSPACE:-./workspace}:/app/workspace
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9527/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cogito-data:
    driver: local

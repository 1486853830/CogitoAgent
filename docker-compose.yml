version: '3.8'

services:
  cogito-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cogito-agent
    restart: unless-stopped
    ports:
      - '9527:9527'
      - '9528:9528'
    environment:
      - NODE_ENV=production
      - COGITO_THINKING_INTERVAL=3000
      # API 配置（通过环境变量或配置文件设置）
      - COGITO_API_KEY=${COGITO_API_KEY}
      - COGITO_API_BASE_URL=${COGITO_API_BASE_URL:-https://api.openai.com/v1}
      - COGITO_MODEL=${COGITO_MODEL:-gpt-4o}
      - COGITO_WORKSPACE=/app/workspace
      # WS 访问令牌：容器绑定 0.0.0.0，访问控制完全依赖此 token。
      # 必须在 .env 中设置一个强随机值，否则每次重启 token 随机变化，客户端无法接入。
      - COGITO_WS_TOKEN=${COGITO_WS_TOKEN}
    volumes:
      # 持久化配置（若本地无 config.json，先创建空文件再映射，避免 Docker 挂载目录覆盖）
      - ./config.json:/app/config.json:ro
      # 持久化数据
      - cogito-data:/app/data
      # 工作区（可选，映射本地目录）
      - ${COGITO_WORKSPACE:-./workspace}:/app/workspace
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9528/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  cogito-data:
    driver: local

name: Release

on:
  tag:
    - v*

stages:
  - build
  - release

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      docker build -t cogito-agent:${VERSION} .
      docker build -t cogito-agent:latest .
  only:
    - tags
  tags:
    - docker

docker-push:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      # 推送镜像（需要先在 Gitee 设置凭证）
      # docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
      # docker push cogito-agent:${VERSION}
      # docker push cogito-agent:latest
      echo "镜像构建完成，请手动推送或配置仓库凭证"
  only:
    - tags
  tags:
    - docker
  when: manual

gitee-release:
  stage: release
  image: curlimages/curl:latest
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      CHANGELOG="发布版本 ${VERSION}"
      curl -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
        -H "Content-Type: application/json" \
        -d "{\"tag_name\": \"${CI_COMMIT_TAG}\", \"name\": \"${VERSION}\", \"body\": \"${CHANGELOG}\"}"
  only:
    - tags
  environment: production
  tags:
    - curl

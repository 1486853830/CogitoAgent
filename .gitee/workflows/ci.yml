version: '1.0'
name: CI
displayName: CI
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - project
        - develop
  pull_request:
    branches:
      prefix:
        - project
        - develop
stages:
  - stage:
      name: test
      displayName: Test
      strategy: naturally
      trigger: auto
      steps:
        - step: npmbuild@1
          name: npm_ci
          displayName: Install dependencies
          inputs:
            nodeVersion: 18
            goals: npm ci
        - step: npmbuild@1
          name: npm_test
          displayName: Run tests
          inputs:
            nodeVersion: 18
            goals: npm test
  - stage:
      name: build
      displayName: Build
      strategy: naturally
      trigger: auto
      steps:
        - step: dockerbuild@1
          name: docker_build
          displayName: Build Docker image
          inputs:
            dockerFile: Dockerfile
            imageName: cogito-agent
            tags: ${CI_COMMIT_SHA}

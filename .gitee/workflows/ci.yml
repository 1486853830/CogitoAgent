name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

cache:
  npm:
    enable: true

stages:
  - test
  - build

test:
  stage: test
  image: node:18-alpine
  script:
    - npm ci
    - npm run lint
    - npm test

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t cogito-agent:${CI_COMMIT_SHA} .
    - docker run -d --name cogito-test cogito-agent:${CI_COMMIT_SHA}
    - sleep 5
    - docker logs cogito-test
    - docker stop cogito-test
  only:
    - master
    - develop
    - tags

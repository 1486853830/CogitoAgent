<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogitoAgent Monitor</title>
  <link rel="stylesheet" href="../shared/tokens.css">
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="../shared/widgets/widgets.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部标题栏（拖动区） -->
    <div class="title-bar has-trace">
      <div class="title-meta">
        <span class="meta-tag">VIEW</span>
        <span class="meta-value">MONITOR</span>
      </div>
      <div class="drag-region"></div>
      <div class="window-controls">
        <button class="win-btn minimize" id="btnMinimize" data-i18n-title="common.minimize">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <path d="M19 13H5v-2h14v2z"/>
          </svg>
        </button>
        <button class="win-btn close" id="btnClose" data-i18n-title="common.close">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 顶部 Tab 切换栏 -->
    <div class="widget-tabs" style="padding: 8px 16px 0;">
      <button class="widget-tab active" data-pane="overviewPane">OVERVIEW</button>
      <button class="widget-tab" data-pane="detailPane">DETAIL</button>
    </div>

    <div class="content">
      <!-- 左列：OVERVIEW(可观测 widget) -->
      <div class="content-left overview-pane active" id="overviewPane">
        <div class="widget-grid">
          <div class="widget-col-12" id="widgetStatCards"></div>
          <div class="widget-col-6" id="widgetTokenRate"></div>
          <div class="widget-col-6" id="widgetEcg"></div>
          <div class="widget-col-8" id="widgetHeatmap"></div>
          <div class="widget-col-4" id="widgetToolRank"></div>
        </div>
      </div>

      <!-- 右列：DETAIL(原思维链/工具统计/集群) -->
      <div class="content-left detail-pane" id="detailPane" style="display:none;">
      <!-- 左列：思维链 + 工具统计 -->
      <div class="content-left">
        <!-- 思维链面板 -->
        <div class="panel" id="thoughtPanel">
          <div class="panel-header">
            <h3><span class="panel-mark">›</span> THOUGHT TRACE</h3>
            <button class="panel-toggle" id="toggleThoughtPanel">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/>
              </svg>
            </button>
          </div>
          <div class="panel-body" id="thoughtPanelBody">
            <div class="thought-timeline" id="thoughtTimeline"></div>
          </div>
        </div>

        <!-- 工具统计面板 -->
        <div class="panel" id="statsPanel">
          <div class="panel-header">
            <h3><span class="panel-mark">›</span> TOOL STATS</h3>
            <button class="panel-toggle" id="toggleStatsPanel">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/>
              </svg>
            </button>
          </div>
          <div class="panel-body" id="statsPanelBody">
            <div class="stats-overview">
              <div class="stat-item">
                <span class="stat-value" id="statTotalCalls">0</span>
                <span class="stat-label" data-i18n="monitor.totalCalls">总调用</span>
              </div>
              <div class="stat-item">
                <span class="stat-value" id="statSuccessRate">0%</span>
                <span class="stat-label" data-i18n="monitor.successRate">成功率</span>
              </div>
            </div>
            <div class="chart-container">
              <div id="toolUsageChart" style="width: 100%; height: 200px;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右列：智能体集群 -->
      <div class="content-right">
        <div class="panel" id="clusterPanel">
          <div class="panel-header">
            <h3><span class="panel-mark">›</span> AGENT CLUSTER</h3>
            <button class="panel-toggle" id="toggleClusterPanel">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/>
              </svg>
            </button>
          </div>
          <div class="panel-body" id="clusterPanelBody">
            <div class="cluster-empty">
              <span class="cluster-empty-text">NO ACTIVE AGENTS</span>
              <span class="cluster-empty-hint" data-i18n="monitor.clusterHint">使用 /spawn 命令创建子智能体</span>
            </div>
            <div class="cluster-topology" id="clusterTopology">
              <canvas id="clusterTopologyCanvas"></canvas>
            </div>
            <div class="cluster-list" id="clusterList"></div>
          </div>
        </div>
      </div>
      </div><!-- end detail-pane -->
    </div>
  </div>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/window-controls.js"></script>
  <script src="../shared/panel-toggle.js"></script>
  <script src="../shared/widgets/widget-registry.js"></script>
  <script src="../shared/widgets/widget-stat-cards.js"></script>
  <script src="../shared/widgets/widget-token-rate.js"></script>
  <script src="../shared/widgets/widget-ecg.js"></script>
  <script src="../shared/widgets/widget-heatmap.js"></script>
  <script src="../shared/widgets/widget-tool-rank.js"></script>
  <script src="../../node_modules/echarts/dist/echarts.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

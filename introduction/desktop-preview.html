<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>CogitoAgent Desktop · Live Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{
  --ink:#0b0e14;--ink-2:#070a0f;--ink-3:#05070c;
  --panel:#11151f;--panel-2:#161b28;--panel-3:#1c2230;--panel-elevated:#1a2030;
  --overlay:rgba(11,14,20,0.72);
  --panel-gradient:linear-gradient(180deg,var(--panel-2)0%,var(--panel)100%);
  --panel-glass:linear-gradient(180deg,rgba(28,34,48,0.55)0%,rgba(17,21,31,0.85)100%);
  --panel-recessed:linear-gradient(180deg,var(--ink-3)0%,var(--ink-2)100%);
  --line:rgba(180,200,230,0.08);--line-strong:rgba(180,200,230,0.16);
  --line-phosphor:rgba(94,234,212,0.24);--line-phosphor-strong:rgba(94,234,212,0.45);
  --line-top:rgba(255,255,255,0.04);
  --phosphor:#5eead4;--phosphor-dim:#2dd4bf;--phosphor-bright:#7ff5dd;
  --phosphor-glow:rgba(94,234,212,0.35);--phosphor-soft:rgba(94,234,212,0.10);
  --amber:#fbbf24;--amber-dim:#f59e0b;--amber-soft:rgba(251,191,36,0.10);
  --crimson:#f87171;--crimson-soft:rgba(248,113,113,0.10);
  --silver:#c4cdd9;--silver-dim:#8b95a5;--silver-faint:#5a6473;
  --type:#cbd5e1;--type-bright:#f1f5f9;--type-highlight:#fff;
  --type-dim:#64748b;--type-faint:#475569;
  --accent:var(--phosphor);--accent-soft:var(--phosphor-soft);
  --font-display:'Space Grotesk','IBM Plex Sans','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-sans:'Inter','IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Code','SF Mono','Consolas','Courier New',monospace;
  --text-xs:10px;--text-sm:11px;--text-base:13px;--text-md:14px;--text-lg:16px;--text-xl:20px;--text-2xl:28px;
  --radius-xs:3px;--radius-sm:4px;--radius-md:6px;--radius-lg:10px;
  --dur-fast:0.15s;--dur:0.25s;--ease:cubic-bezier(0.4,0,0.2,1);--ease-out:cubic-bezier(0.16,1,0.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:var(--type);-webkit-font-smoothing:antialiased;user-select:none}
body{background:var(--ink);position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;background:url('background.png') center/cover no-repeat;opacity:0.35;pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 40% at 80% 90%,rgba(94,234,212,0.15)0%,transparent 60%),radial-gradient(ellipse 40% 30% at 20% 20%,rgba(45,212,191,0.10)0%,transparent 60%);pointer-events:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--line-phosphor)}
.has-trace{position:relative;overflow:hidden}
.has-trace::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,var(--phosphor)50%,transparent 100%);opacity:0.45;animation:phosphor-scan 4s linear infinite;pointer-events:none;z-index:1}
@keyframes phosphor-scan{0%{transform:translateX(-100%);opacity:0}10%{opacity:0.5}50%{opacity:0.7}90%{opacity:0.5}100%{transform:translateX(100%);opacity:0}}

/* Character avatar */
.character{position:fixed;right:20px;bottom:20px;width:140px;height:280px;border-radius:70px;overflow:hidden;z-index:1;box-shadow:0 8px 40px rgba(0,0,0,0.45),0 0 0 1px var(--line-phosphor),0 0 24px rgba(94,234,212,0.12);cursor:default;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.character::after{content:'';position:absolute;inset:0;border-radius:70px;pointer-events:none;z-index:2;background:linear-gradient(180deg,transparent 0%,transparent 70%,rgba(94,234,212,0.08)100%)}
.character:hover{transform:scale(1.04);box-shadow:0 12px 48px rgba(0,0,0,0.55),0 0 0 1px var(--phosphor),0 0 32px rgba(94,234,212,0.25)}
.character .avatar-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1a1a2e 0%,#0f0f1e 40%,#16213e 100%);position:relative}
.avatar-glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 60%,rgba(94,234,212,0.15)0%,transparent 70%);pointer-events:none}
.avatar-icon{font-size:40px;line-height:1;margin-bottom:8px;opacity:0.6}
.avatar-label{font-family:var(--font-mono);font-size:9px;color:var(--phosphor);letter-spacing:0.2em;text-transform:uppercase;opacity:0.7}
.avatar-scanline{position:absolute;inset:0;border-radius:70px;background:linear-gradient(180deg,transparent 0%,rgba(94,234,212,0.03)50%,transparent 100%);background-size:100% 4px;animation:scanline 8s linear infinite;pointer-events:none}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}

/* Panel */
.panel{position:fixed;right:180px;bottom:20px;width:420px;max-height:520px;background:var(--overlay);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);border-radius:var(--radius-md);border:1px solid var(--line-strong);box-shadow:0 16px 64px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.04);display:flex;flex-direction:column;z-index:2;overflow:hidden}
.drag-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(11,14,20,0.4)}
.drag-bar .title{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:500;color:var(--phosphor);letter-spacing:0.18em}
.controls{display:flex;gap:4px}
.btn-icon{width:26px;height:26px;border:1px solid transparent;border-radius:var(--radius-xs);background:transparent;color:var(--type-dim);font-family:var(--font-mono);font-size:var(--text-md);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--dur-fast) var(--ease)}
.btn-icon:hover{background:var(--panel-3);color:var(--type-bright);border-color:var(--line)}
#btnClose:hover{background:var(--crimson-soft);color:var(--crimson);border-color:rgba(248,113,113,0.22)}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:360px}
.empty-hint{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px 20px}
.hint-icon{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--type-faint);letter-spacing:0.18em}
.hint-text{color:var(--type-faint);font-size:var(--text-base)}

/* Message bubbles */
.message{display:flex;flex-direction:column;max-width:85%;animation:msgIn 0.3s var(--ease-out)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end}
.message.assistant{align-self:flex-start}
.message .bubble{padding:8px 12px;border-radius:var(--radius-sm);font-size:var(--text-base);line-height:1.5;word-wrap:break-word;border:1px solid}
.message.user .bubble{background:var(--panel-3);border-color:var(--line-strong);color:var(--type-bright);border-bottom-right-radius:var(--radius-xs)}
.message.assistant .bubble{background:var(--panel-2);border-color:var(--line);color:var(--type);border-bottom-left-radius:var(--radius-xs)}
.message .time{font-size:var(--text-xs);color:var(--type-faint);margin-top:4px;padding:0 4px}
.message.user .time{text-align:right}
.message.error .bubble{background:var(--crimson-soft);border-color:rgba(248,113,113,0.22);color:var(--crimson)}
.message .bubble code{font-family:var(--font-mono);font-size:var(--text-sm);background:rgba(0,0,0,0.25);padding:1px 4px;border-radius:2px}
.message .bubble pre code{display:block;padding:8px;overflow-x:auto;background:rgba(0,0,0,0.3);border-radius:var(--radius-xs);border:1px solid var(--line);margin:6px 0;color:var(--type)}

/* Tool call cards */
.tool-call-card{margin:6px 0;border:1px solid var(--line);border-radius:var(--radius-xs);overflow:hidden;background:rgba(0,0,0,0.15)}
.tool-call-header{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--amber);background:var(--amber-soft);transition:background var(--dur-fast) var(--ease)}
.tool-call-header:hover{background:rgba(251,191,36,0.15)}
.tool-call-header .prefix{color:var(--amber-dim);font-weight:600}
.tool-call-header .toggle-icon{font-size:9px;margin-left:auto;color:var(--type-faint);transition:transform var(--dur-fast) var(--ease)}
.tool-call-header .toggle-icon.expanded{transform:rotate(90deg)}
.tool-call-body{display:none;padding:6px 8px;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--type-dim);background:rgba(0,0,0,0.2);border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
.tool-result{display:flex;align-items:center;gap:6px;padding:5px 8px;margin:6px 0;font-family:var(--font-mono);font-size:var(--text-sm);border-radius:var(--radius-xs);border:1px solid var(--line);background:rgba(0,0,0,0.15)}
.tool-result.ok{color:var(--phosphor);border-color:var(--line-phosphor)}
.tool-result.err{color:var(--crimson);border-color:rgba(248,113,113,0.22)}
.tool-result .result-prefix{font-weight:600}

/* Input area */
.input-area{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;background:rgba(11,14,20,0.4)}
.input-prompt{font-family:var(--font-mono);color:var(--phosphor);font-size:var(--text-md);font-weight:600;flex-shrink:0;user-select:none}
.input-wrapper{display:flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:var(--radius-xs);padding:3px 3px 3px 12px;border:1px solid var(--line);transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease);flex:1}
.input-wrapper:focus-within{border-color:var(--line-phosphor);box-shadow:0 0 0 1px var(--line-phosphor)}
#userInput{flex:1;background:transparent;border:none;outline:none;color:var(--type-bright);font-family:var(--font-mono);font-size:var(--text-base);padding:7px 0;letter-spacing:0.01em}
#userInput::placeholder{color:var(--type-faint)}
.btn-send{width:32px;height:32px;border:1px solid var(--line-phosphor);border-radius:var(--radius-xs);background:var(--phosphor-soft);color:var(--phosphor);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--dur-fast) var(--ease);flex-shrink:0}
.btn-send:hover{background:rgba(94,234,212,0.18);color:var(--phosphor-dim);box-shadow:0 0 12px rgba(94,234,212,0.25)}
.btn-send:active{transform:scale(0.94)}

/* Status indicator */
.status-indicator{position:fixed;left:10px;bottom:10px;width:6px;height:6px;border-radius:50%;z-index:3;transition:all var(--dur) var(--ease)}
.status-idle{background:var(--phosphor);box-shadow:0 0 8px var(--phosphor-glow)}
.status-thinking{background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,0.45);animation:pulse 1.5s ease-in-out infinite}
.status-speaking{background:var(--phosphor);box-shadow:0 0 12px var(--phosphor-glow);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.8}50%{transform:scale(1.4);opacity:1}}

/* Typing indicator */
.typing-indicator{display:flex;align-items:center;gap:4px;padding:4px 0}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--type-dim);animation:typingBounce 1.4s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-6px);opacity:1}}
</style>
</head>
<body>
<div class="character">
  <div class="avatar-placeholder">
    <div class="avatar-glow"></div>
    <div class="avatar-scanline"></div>
    <div class="avatar-icon">🤖</div>
    <div class="avatar-label">COGITO</div>
  </div>
</div>

<div class="panel" id="panel">
  <div class="drag-bar has-trace">
    <span class="title">COGITO/AGENT</span>
    <div class="controls">
      <button class="btn-icon" data-i18n-title="preview.dashboardTitle" title="工作台" id="btnDashboard">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
      </button>
      <button class="btn-icon" data-i18n-title="common.minimize" title="最小化">−</button>
      <button class="btn-icon" id="btnClose" data-i18n-title="common.close" title="关闭">×</button>
    </div>
  </div>
  <div class="messages" id="messages">
    <div class="empty-hint">
      <div class="hint-icon">COGITO/AGENT</div>
      <div class="hint-text" data-i18n="preview.desktopIdle">待命中 · 输入指令开始对话</div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-prompt">›</div>
    <div class="input-wrapper">
      <input type="text" id="userInput" data-i18n-placeholder="preview.inputPlaceholder" placeholder="输入指令..." autocomplete="off">
      <button class="btn-send" id="btnSend" data-i18n-title="common.send" title="发送">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="status-indicator" id="statusIndicator"></div>

<script src="../electron/shared/i18n.js"></script>
<script>
// ============================================================
// Mock Chat Simulation
// ============================================================
const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const btnSend = document.getElementById('btnSend');
const statusEl = document.getElementById('statusIndicator');

let msgCount = 0;
let isProcessing = false;

function setStatus(state) {
  statusEl.className = 'status-indicator status-' + state;
}

function escapeHtml(s) {
  let str = String(s == null ? '' : s);
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/\//g, '&#x2F;');
}

function addMessage(type, content, extra, isHtml) {
  const el = document.createElement('div');
  el.className = 'message ' + type;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (isHtml) {
    const template = document.createElement('template');
    template.innerHTML = content;
    bubble.append(template.content);
  } else {
    bubble.textContent = content == null ? '' : String(content);
  }
  el.appendChild(bubble);

  if (extra && extra.time) {
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = extra.time;
    el.appendChild(time);
  }
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (messagesEl.querySelector('.empty-hint')) {
    messagesEl.querySelector('.empty-hint').remove();
  }
}

function addToolCall(toolName, args) {
  const el = document.createElement('div');
  el.className = 'message assistant';
  el.innerHTML = `<div class="bubble"><div class="tool-call-card"><div class="tool-call-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.toggle-icon').classList.toggle('expanded')"><span class="prefix">»</span> ${escapeHtml(toolName)}(${escapeHtml(Object.keys(args||{}).slice(0,2).join(', '))})<span class="toggle-icon">▸</span></div><div class="tool-call-body">${escapeHtml(JSON.stringify(args||{},null,2))}</div></div></div>`;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (messagesEl.querySelector('.empty-hint')) messagesEl.querySelector('.empty-hint').remove();
}

function addToolResult(name, success) {
  const el = document.createElement('div');
  el.className = 'message assistant';
  el.innerHTML = `<div class="bubble"><div class="tool-result ${success?'ok':'err'}"><span class="result-prefix">${success?'OK':'ERR'}</span> ${escapeHtml(name)}</div></div>`;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'message assistant';
  el.id = 'typingIndicator';
  el.innerHTML = '<div class="bubble"><div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>';
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (messagesEl.querySelector('.empty-hint')) messagesEl.querySelector('.empty-hint').remove();
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function timeStr() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
}

// Simulated conversation flow
const userMessages = [
  '帮我查一下最新的 TypeScript 文档',
  '分析一下这个项目的代码结构',
  '创建一个新的 React 组件',
  '搜索关于 WebSocket 的最佳实践',
  '帮我优化这段代码的性能',
  '总结一下今天的 commit 记录',
];
const assistantReplies = [
  '好的，我来搜索 TypeScript 相关文档。<br><br>根据搜索结果，TypeScript 5.0 引入了修饰器（Decorators）的标准实现，以及 `const` 类型参数等新特性。主要文档地址：<code>typescriptlang.org/docs/</code>',
  '正在分析项目结构...<br><br>项目采用了模块化架构，主要包含：<br>• <code>src/</code> — 核心源码<br>• <code>electron/</code> — 桌面端<br>• <code>tests/</code> — 测试套件<br>• <code>plugins/</code> — 插件系统<br><br>共发现 28 个工具模块，注册在 <code>registry.ts</code> 中。',
  '好的，我现在来创建一个 React 组件模板。<br><br>组件已创建完成，包含 TypeScript 类型定义、样式模块和 Storybook 故事文件。',
  '正在搜索 WebSocket 最佳实践...<br><br>推荐使用 <code>ws</code> 库实现自动重连，心跳检测间隔 30 秒，并实现指数退避重试策略。',
  '让我分析一下这段代码...<br><br>发现主要瓶颈在循环内的重复计算，建议使用 <code>useMemo</code> 缓存中间结果，预期可提升 40% 性能。',
  '正在拉取今日的 commit 记录...<br><br>今日共 12 个 commit，主要涉及：<br>• 修复登录页面样式问题<br>• 优化 API 响应缓存<br>• 新增单元测试覆盖率检查',
];

const toolCalls = [
  { name: 'webSearch', args: { query: 'TypeScript 5.0 documentation', maxResults: 5 } },
  { name: 'readFile', args: { path: 'src/', pattern: '*.ts', recursive: true } },
  { name: 'executeCode', args: { language: 'typescript', code: 'npx create-react-component' } },
  { name: 'webSearch', args: { query: 'WebSocket reconnection best practices', maxResults: 10 } },
  { name: 'readFile', args: { path: 'src/components/', pattern: '*.tsx' } },
  { name: 'executeCode', args: { language: 'bash', code: 'git log --oneline --since=midnight' } },
];

let simIndex = 0;

function simulateConversation() {
  if (simIndex >= userMessages.length) {
    simIndex = 0;
    setTimeout(simulateConversation, 8000);
    return;
  }
  const idx = simIndex;
  setStatus('thinking');
  // Simulate user message
  addMessage('user', userMessages[idx], { time: timeStr() });

  // Simulate tool call
  setTimeout(() => {
    const tc = toolCalls[idx];
    addToolCall(tc.name, tc.args);
    setStatus('thinking');
  }, 600);

  // Simulate tool result
  setTimeout(() => {
    addToolResult(toolCalls[idx].name, true);
    setStatus('thinking');
  }, 1200);

  // Simulate typing
  setTimeout(() => {
    addTyping();
    setStatus('thinking');
  }, 1600);

  // Simulate response
  setTimeout(() => {
    removeTyping();
    addMessage('assistant', assistantReplies[idx], { time: timeStr() }, true);
    setStatus('idle');
    simIndex++;
    setTimeout(simulateConversation, 4000);
  }, 2800);
}

// User input handling
btnSend.addEventListener('click', sendMessage);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  addMessage('user', text, { time: timeStr() });
  setStatus('thinking');
  addTyping();
  setTimeout(() => {
    removeTyping();
    const replyKey = 'preview.simulatedReply';
    let reply = window.I18n ? window.I18n.t(replyKey, { text: escapeHtml(text) }) : '';
    if (!reply) {
      reply = '收到您的消息：<code>' + escapeHtml(text) + '</code><br><br>这是一个模拟回复。在真实环境中，CogitoAgent 会调用工具来分析并回复您的问题。';
    }
    addMessage('assistant', reply, { time: timeStr() }, true);
    setStatus('idle');
  }, 1500);
}

// Init
setStatus('idle');
setTimeout(simulateConversation, 1500);

// Simulate random status changes
setInterval(() => {
  if (Math.random() < 0.3 && !isProcessing) {
    setStatus('thinking');
    setTimeout(() => setStatus('idle'), 2000);
  }
}, 8000);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CogitoAgent Monitor · Live Demo</title>
<style>
/* ===== Design Tokens (from tokens.css) ===== */
:root {
  --ink: #0b0e14; --ink-2: #070a0f; --ink-3: #05070c;
  --panel: #11151f; --panel-2: #161b28; --panel-3: #1c2230; --panel-elevated: #1a2030;
  --overlay: rgba(11,14,20,0.72);
  --panel-gradient: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
  --panel-glass: linear-gradient(180deg, rgba(28,34,48,0.55) 0%, rgba(17,21,31,0.85) 100%);
  --panel-recessed: linear-gradient(180deg, var(--ink-3) 0%, var(--ink-2) 100%);
  --line: rgba(180,200,230,0.08); --line-strong: rgba(180,200,230,0.16);
  --line-phosphor: rgba(94,234,212,0.24); --line-phosphor-strong: rgba(94,234,212,0.45);
  --line-top: rgba(255,255,255,0.04);
  --phosphor: #5eead4; --phosphor-dim: #2dd4bf; --phosphor-bright: #7ff5dd;
  --phosphor-glow: rgba(94,234,212,0.35); --phosphor-soft: rgba(94,234,212,0.10);
  --amber: #fbbf24; --amber-dim: #f59e0b; --amber-soft: rgba(251,191,36,0.10);
  --crimson: #f87171; --crimson-soft: rgba(248,113,113,0.10);
  --silver: #c4cdd9; --silver-dim: #8b95a5; --silver-faint: #5a6473;
  --type: #cbd5e1; --type-bright: #f1f5f9; --type-highlight: #fff;
  --type-dim: #64748b; --type-faint: #475569;
  --accent: var(--phosphor); --accent-soft: var(--phosphor-soft); --accent-glow: var(--phosphor-glow);
  --success: var(--phosphor); --warning: var(--amber); --error: var(--crimson);
  --font-display: 'Space Grotesk','IBM Plex Sans','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-sans: 'Inter','IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-mono: 'JetBrains Mono','Cascadia Code','SF Mono','Consolas','Courier New',monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --radius-xs:3px;--radius-sm:4px;--radius-md:6px;--radius-lg:10px;--radius-xl:14px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);--shadow-md:0 4px 12px rgba(0,0,0,0.35),0 1px 0 var(--line-top) inset;
  --shadow-lg:0 12px 32px rgba(0,0,0,0.5),0 1px 0 var(--line-top) inset;
  --shadow-panel-ambient:0 0 0 1px var(--line),0 1px 0 var(--line-top) inset,0 8px 24px rgba(0,0,0,0.32);
  --glow-phosphor:0 0 0 1px var(--line-phosphor),0 0 16px rgba(94,234,212,0.12);
  --text-xs:10px;--text-sm:11px;--text-base:13px;--text-md:14px;--text-lg:16px;--text-xl:20px;--text-2xl:28px;
  --tracking-tight:-0.02em;--tracking-normal:0;--tracking-wide:0.08em;--tracking-wider:0.14em;
  --ease:cubic-bezier(0.4,0,0.2,1);--ease-out:cubic-bezier(0.16,1,0.3,1);
  --dur-fast:0.15s;--dur:0.25s;--dur-slow:0.4s;
}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:var(--type);background:var(--ink);user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01','cv02','cv03';font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:transparent;color:inherit;font-size:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(180,200,230,0.14);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--line-phosphor)}
.has-trace{position:relative;overflow:hidden}
.has-trace::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,var(--phosphor) 50%,transparent 100%);opacity:0.45;animation:phosphor-scan 4s linear infinite;pointer-events:none;z-index:1}
@keyframes phosphor-scan{0%{transform:translateX(-100%);opacity:0}10%{opacity:0.5}50%{opacity:0.7}90%{opacity:0.5}100%{transform:translateX(100%);opacity:0}}
.telemetry-label{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:500;letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--type-faint)}

/* ===== Monitor style (from style.css) ===== */
html,body{background:var(--ink)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(94,234,212,0.025) 0%,transparent 30%),radial-gradient(ellipse 70% 40% at 50% 0%,rgba(94,234,212,0.04) 0%,transparent 60%);pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(94,234,212,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,0.025) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,black 0%,transparent 80%);mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,black 0%,transparent 80%);pointer-events:none}

.app-container{display:flex;flex-direction:column;width:100%;height:100vh;overflow:hidden;position:relative;z-index:1}
.title-bar{height:34px;display:flex;align-items:center;gap:14px;padding-left:14px;background:linear-gradient(180deg,var(--panel) 0%,var(--ink) 100%);border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.title-meta{display:flex;align-items:baseline;gap:6px;font-family:var(--font-mono)}
.title-meta .meta-tag{font-size:9px;color:var(--type-faint);letter-spacing:0.18em;text-transform:uppercase}
.title-meta .meta-value{font-size:11px;font-weight:600;color:var(--phosphor);letter-spacing:0.14em;text-transform:uppercase}
.drag-region{flex:1;height:100%}
.live-badge{display:flex;align-items:center;gap:6px;padding:2px 10px;background:var(--crimson-soft);border:1px solid rgba(248,113,113,0.2);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:9px;color:var(--crimson);letter-spacing:0.1em;animation:live-pulse 2s ease-in-out infinite}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--crimson);box-shadow:0 0 6px var(--crimson)}
@keyframes live-pulse{0%,100%{opacity:0.7}50%{opacity:1}}

.content{flex:1;overflow:hidden;padding:12px;display:flex;flex-direction:row;gap:12px}
.content-left{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;overflow-y:auto}
.content-right{width:320px;min-width:320px;overflow-y:auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;transition:border-color var(--dur-fast) var(--ease)}
.panel:hover{border-color:var(--line-strong)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);position:relative}
.panel-header::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--phosphor);box-shadow:0 0 8px var(--phosphor-glow);opacity:0.7}
.panel-header h3{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--type-bright);letter-spacing:0.14em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:6px}
.panel-mark{color:var(--phosphor);font-weight:700;margin-right:2px}
.panel-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--type-faint);border-radius:var(--radius-xs);transition:all var(--dur-fast) var(--ease)}
.panel-toggle:hover{background:var(--panel-3);color:var(--phosphor)}
.panel-body{padding:12px}
.panel-body.collapsed{display:none}

/* ===== Widgets CSS (from widgets.css) ===== */
.widget-card{position:relative;background:var(--panel-gradient);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-4);overflow:hidden;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.widget-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--line-phosphor) 50%,transparent);opacity:0.35;pointer-events:none}
.widget-card:hover{border-color:var(--line-phosphor);box-shadow:var(--shadow-panel-ambient)}
.widget-head{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--type-faint)}
.widget-head-mark{color:var(--phosphor);font-size:var(--text-sm)}
.widget-head-label{flex:1}
.widget-head-meta{color:var(--type-dim);font-size:var(--text-xs)}
.widget-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--space-3)}
.widget-col-12{grid-column:span 12}
.widget-col-8{grid-column:span 8}
.widget-col-6{grid-column:span 6}
.widget-col-4{grid-column:span 4}
.widget-empty{padding:var(--space-6);text-align:center;color:var(--type-faint);font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-wide)}

/* Stat Cards */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--space-3)}
.stat-card{position:relative;background:var(--panel-recessed);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);overflow:hidden;transition:transform var(--dur) var(--ease-out),border-color var(--dur) var(--ease)}
.stat-card:hover{transform:translateY(-1px);border-color:var(--line-phosphor)}
.stat-card-label{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--type-faint);margin-bottom:var(--space-1)}
.stat-card-value{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:600;color:var(--type-bright);letter-spacing:var(--tracking-tight);font-variant-numeric:tabular-nums;line-height:1.1}
.stat-card-unit{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--type-dim);margin-left:var(--space-1)}

/* Token Rate */
.token-rate-wrap{display:flex;align-items:center;gap:var(--space-4)}
.token-rate-ring{position:relative;width:96px;height:96px;flex-shrink:0}
.token-rate-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.token-rate-ring .ring-bg{fill:none;stroke:var(--line);stroke-width:6}
.token-rate-ring .ring-fg{fill:none;stroke:var(--phosphor);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--phosphor-glow));transition:stroke-dashoffset var(--dur) var(--ease-out)}
.token-rate-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.token-rate-value{font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;color:var(--phosphor);line-height:1;font-variant-numeric:tabular-nums}
.token-rate-unit{font-family:var(--font-mono);font-size:9px;color:var(--type-dim);margin-top:2px}
.token-rate-stats{flex:1;display:flex;flex-direction:column;gap:var(--space-2);font-size:var(--text-sm)}
.token-rate-row{display:flex;justify-content:space-between;align-items:center}
.token-rate-key{color:var(--type-dim);font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-wide);text-transform:uppercase}
.token-rate-val{color:var(--type-bright);font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ECG */
.ecg-wrap{position:relative;height:80px;background:var(--panel-recessed);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.ecg-canvas{display:block;width:100%;height:100%}
.ecg-legend{position:absolute;top:var(--space-2);right:var(--space-2);display:flex;gap:var(--space-3);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--type-dim);letter-spacing:var(--tracking-wide)}
.ecg-legend-item{display:flex;align-items:center;gap:var(--space-1)}
.ecg-legend-dot{width:6px;height:6px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 4px var(--phosphor-glow)}
.ecg-legend-dot.amber{background:var(--amber);box-shadow:0 0 4px rgba(251,191,36,0.4)}
.ecg-legend-dot.crimson{background:var(--crimson);box-shadow:0 0 4px rgba(248,113,113,0.4)}

/* Heatmap */
.heatmap-wrap{overflow-x:auto;padding-bottom:var(--space-2)}
.heatmap-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content}
.heatmap-cell{width:11px;height:11px;border-radius:2px;background:var(--panel-3);transition:transform var(--dur-fast) var(--ease)}
.heatmap-cell:hover{transform:scale(1.4);z-index:2;outline:1px solid var(--line-phosphor)}
.heatmap-cell.l1{background:rgba(94,234,212,0.25)}
.heatmap-cell.l2{background:rgba(94,234,212,0.45)}
.heatmap-cell.l3{background:rgba(94,234,212,0.7)}
.heatmap-cell.l4{background:var(--phosphor);box-shadow:0 0 4px var(--phosphor-glow)}
.heatmap-legend{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--type-dim)}
.heatmap-legend-cells{display:flex;gap:3px}

/* Tool Rank */
.tool-rank-list{display:flex;flex-direction:column;gap:var(--space-2)}
.tool-rank-item{display:grid;grid-template-columns:24px 1fr auto;gap:var(--space-2);align-items:center;padding:var(--space-1) 0}
.tool-rank-no{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--type-faint);text-align:right}
.tool-rank-name{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--type-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-rank-bar-wrap{grid-column:1/-1;height:4px;background:var(--panel-recessed);border-radius:2px;overflow:hidden;margin-top:2px}
.tool-rank-bar{height:100%;background:linear-gradient(90deg,var(--phosphor-dim),var(--phosphor));border-radius:2px;transition:width var(--dur) var(--ease-out);box-shadow:0 0 6px var(--phosphor-glow)}
.tool-rank-bar.warn{background:linear-gradient(90deg,var(--amber-dim),var(--amber));box-shadow:0 0 6px rgba(251,191,36,0.4)}
.tool-rank-bar.danger{background:linear-gradient(90deg,var(--crimson-dim),var(--crimson));box-shadow:0 0 6px rgba(248,113,113,0.4)}
.tool-rank-count{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--phosphor);font-variant-numeric:tabular-nums}

/* Tabs */
.widget-tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--line);margin-bottom:var(--space-4)}
.widget-tab{padding:var(--space-2) var(--space-4);font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--type-faint);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.widget-tab:hover{color:var(--type-dim)}
.widget-tab.active{color:var(--phosphor);border-bottom-color:var(--phosphor)}
.widget-tab-pane{display:none}
.widget-tab-pane.active{display:block}

/* Thought Chain */
.thought-timeline{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.thought-step{display:flex;gap:10px;padding:8px 10px 8px 12px;background:var(--panel-2);border-radius:var(--radius-sm);border-left:2px solid var(--type-faint);transition:all var(--dur-fast) var(--ease);position:relative}
.thought-step:hover{background:var(--panel-3)}
.thought-step.running{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-soft) 0%,var(--panel-2) 40%)}
.thought-step.running::before{content:'';position:absolute;left:-2px;top:0;bottom:0;width:2px;background:var(--amber);box-shadow:0 0 6px var(--amber);animation:thought-pulse 1.4s ease-in-out infinite}
@keyframes thought-pulse{0%,100%{opacity:0.5}50%{opacity:1}}
.thought-step.completed{border-left-color:var(--phosphor)}
.thought-step.failed{border-left-color:var(--crimson);background:linear-gradient(90deg,var(--crimson-soft) 0%,var(--panel-2) 40%)}
.thought-step-content{flex:1;min-width:0}
.thought-step-name{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--type-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thought-step-details{font-size:10px;color:var(--type-dim);margin-top:2px}
.thought-step-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:10px;color:var(--type-faint)}
.thought-step-duration{font-family:var(--font-mono);color:var(--type-dim)}
.thought-step-status{padding:1px 6px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.thought-step-status.running{background:var(--amber-soft);color:var(--amber)}
.thought-step-status.completed{background:var(--phosphor-soft);color:var(--phosphor)}
.thought-step-status.failed{background:var(--crimson-soft);color:var(--crimson)}
.thought-empty{text-align:center;padding:28px 12px;color:var(--type-faint);font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase}

/* Stats */
.stats-overview{display:flex;gap:10px;margin-bottom:12px}
.stat-item{flex:1;text-align:center;padding:12px 8px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);position:relative}
.stat-item::before{content:'';position:absolute;top:0;left:30%;right:30%;height:1px;background:var(--phosphor);opacity:0.4}
.stat-value{display:block;font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--phosphor);line-height:1.1;letter-spacing:-0.01em}
.stat-label{display:block;font-family:var(--font-mono);font-size:10px;color:var(--type-faint);margin-top:4px;text-transform:uppercase;letter-spacing:0.1em}
.chart-container{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--panel-2);border:1px solid var(--line);height:200px;display:flex;align-items:flex-end;padding:12px;gap:4px}

/* Agent Cluster */
.cluster-empty{text-align:center;padding:24px 12px}
.cluster-empty-text{display:block;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--type-dim);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px}
.cluster-empty-hint{display:block;font-size:11px;color:var(--type-faint)}
.cluster-topology{height:180px;margin:8px 0;border-radius:var(--radius-sm);background:var(--panel-2);border:1px solid var(--line-phosphor);position:relative;overflow:hidden}
.cluster-topology canvas{width:100%;height:100%;display:block}
.cluster-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.cluster-agent-card{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);transition:all var(--dur-fast) var(--ease);position:relative}
.cluster-agent-card:hover{background:var(--panel-3);border-color:var(--line-phosphor)}
.cluster-agent-card::before{content:'';position:absolute;left:0;top:10%;bottom:10%;width:2px;background:var(--type-faint);border-radius:1px}
.cluster-agent-header{display:flex;align-items:center;justify-content:space-between}
.cluster-agent-name{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--type-bright)}
.cluster-agent-state{font-family:var(--font-mono);font-size:9px;padding:2px 8px;border-radius:var(--radius-xs);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;border:1px solid currentColor}
.cluster-agent-state.idle{color:var(--type-dim);background:rgba(100,116,139,0.08)}
.cluster-agent-state.thinking{color:var(--amber);background:var(--amber-soft);animation:pulse 1.5s ease-in-out infinite}
.cluster-agent-state.tool_executing{color:var(--phosphor);background:var(--phosphor-soft);animation:pulse 1.5s ease-in-out infinite}
.cluster-agent-state.done{color:var(--phosphor);background:var(--phosphor-soft)}
.cluster-agent-state.error{color:var(--crimson);background:var(--crimson-soft)}
.cluster-agent-details{display:flex;gap:12px;font-size:10px;color:var(--type-faint)}
.cluster-agent-detail{display:flex;align-items:center;gap:4px}
.cluster-agent-detail-label{color:var(--type-faint);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);font-size:9px}
.cluster-agent-detail-value{color:var(--type-dim);font-family:var(--font-mono)}
@keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}

/* Chart bars */
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart-bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:height 0.5s var(--ease-out)}
.chart-bar-label{font-family:var(--font-mono);font-size:8px;color:var(--type-dim);writing-mode:vertical-lr;text-orientation:mixed;letter-spacing:0.05em;height:40px;display:flex;align-items:center;justify-content:center}

  .widget-col-12,.widget-col-8,.widget-col-6,.widget-col-4{grid-column:span 12}
  .content-right{width:100%;min-width:0}
  .content{flex-direction:column}
}
</style>
</head>
<body>
<div class="app-container">
  <div class="title-bar has-trace">
    <div class="title-meta"><span class="meta-tag">VIEW</span><span class="meta-value">MONITOR</span></div>
    <div class="drag-region"></div>
    <div class="live-badge"><span class="live-dot"></span>LIVE DEMO</div>
  </div>

  <div class="widget-tabs" style="padding:8px 16px 0;">
    <button class="widget-tab active" data-pane="overviewPane">OVERVIEW</button>
    <button class="widget-tab" data-pane="detailPane">DETAIL</button>
  </div>

  <div class="content">
    <!-- OVERVIEW -->
    <div class="content-left overview-pane active" id="overviewPane">
      <div class="widget-grid">
        <div class="widget-col-12" id="widgetStatCards"></div>
        <div class="widget-col-6" id="widgetTokenRate"></div>
        <div class="widget-col-6" id="widgetEcg"></div>
        <div class="widget-col-8" id="widgetHeatmap"></div>
        <div class="widget-col-4" id="widgetToolRank"></div>
      </div>
    </div>

    <!-- DETAIL -->
    <div class="content-left detail-pane" id="detailPane" style="display:none;">
      <div class="content-left">
        <div class="panel" id="thoughtPanel">
          <div class="panel-header">
            <h3><span class="panel-mark">›</span> THOUGHT TRACE</h3>
            <button class="panel-toggle" id="toggleThoughtPanel">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
            </button>
          </div>
          <div class="panel-body" id="thoughtPanelBody">
            <div class="thought-timeline" id="thoughtTimeline">
              <div class="thought-empty" data-i18n="monitor.thoughtEmpty">等待思考开始...</div>
            </div>
          </div>
        </div>

        <div class="panel" id="statsPanel">
          <div class="panel-header">
            <h3><span class="panel-mark">›</span> TOOL STATS</h3>
            <button class="panel-toggle" id="toggleStatsPanel">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
            </button>
          </div>
          <div class="panel-body" id="statsPanelBody">
            <div class="stats-overview">
              <div class="stat-item"><span class="stat-value" id="statTotalCalls">0</span><span class="stat-label" data-i18n="monitor.calls">调用次数</span></div>
              <div class="stat-item"><span class="stat-value" id="statSuccessRate">0%</span><span class="stat-label" data-i18n="monitor.successRate">成功率</span></div>
            </div>
            <div class="chart-container" id="toolUsageChart"></div>
          </div>
        </div>
      </div>

      <div class="content-right">
        <div class="panel" id="clusterPanel">
          <div class="panel-header">
            <h3><span class="panel-mark">›</span> AGENT CLUSTER</h3>
            <button class="panel-toggle" id="toggleClusterPanel">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
            </button>
          </div>
          <div class="panel-body" id="clusterPanelBody">
            <div class="cluster-topology" id="clusterTopology" style="display:block;">
              <canvas id="clusterTopologyCanvas"></canvas>
            </div>
            <div class="cluster-list" id="clusterList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../electron/shared/i18n.js"></script>
<script>
// ============================================================
// Mock Data System
// ============================================================
function mt(key, fallback, params) {
  return window.I18n ? (window.I18n.t(key, params) || fallback) : fallback;
}
const MockData = {
  startedAt: Date.now(),
  statCards: {
    todaySessions: 42, todayMessages: 1287, todayToolCalls: 563,
    todayTokens: 89234, totalTokens: 1287654, totalThinkingTime: 8456,
  },
  tokenRate: { samples: [], totalToday: 89234, totalAll: 1287654, maxRate: 150 },
  ecgData: [],
  thoughtSteps: [],
  thoughtId: 0,
  agents: [
    { id: 'agent-a1', name: 'Coder-01', state: 'thinking', persona: 'Software Engineer', toolCalls: 47, iterationCount: 12, lastActiveAt: Date.now() - 2000 },
    { id: 'agent-a2', name: 'Searcher-01', state: 'idle', persona: 'Web Researcher', toolCalls: 23, iterationCount: 8, lastActiveAt: Date.now() - 15000 },
    { id: 'agent-a3', name: 'Analyst-01', state: 'tool_executing', persona: 'Data Analyst', toolCalls: 89, iterationCount: 21, lastActiveAt: Date.now() - 5000 },
    { id: 'agent-a4', name: 'Writer-01', state: 'done', persona: 'Technical Writer', toolCalls: 15, iterationCount: 5, lastActiveAt: Date.now() - 30000 },
  ],
  toolStats: {
    categories: ['file','web','code','git','task','memory','db','ocr','vision','system','browser','email'],
    calls: [156, 89, 67, 45, 38, 29, 22, 18, 15, 12, 8, 6],
    rates: [98, 92, 95, 88, 100, 96, 91, 85, 93, 100, 87, 83],
  },
  toolRank: [
    { toolName: 'readFile', category: 'file', callCount: 89, successRate: 98 },
    { toolName: 'webSearch', category: 'web', callCount: 67, successRate: 92 },
    { toolName: 'executeCode', category: 'code', callCount: 54, successRate: 95 },
  ],
  ecgMaxPoints: 240,
  heatmapData: [],

  generateHeatmap() {
    const data = [];
    const today = new Date();
    for (let i = 364; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      const val = Math.random() < 0.6 ? Math.floor(Math.random() * 200) : 0;
      data.push({ date: dateStr, tokens: val, toolCalls: Math.floor(val * 0.3), sessions: val > 0 ? Math.floor(Math.random() * 5) + 1 : 0, messages: val > 0 ? Math.floor(Math.random() * 20) + 1 : 0 });
    }
    return data;
  },

  pushEcgSample(v) {
    const now = Date.now();
    this.ecgData.push({ t: now, v });
    if (this.ecgData.length > this.ecgMaxPoints) this.ecgData.shift();
  },

  ecgBeat(kind) {
    if (kind === 'fail') { this.pushEcgSample(0.5); this.pushEcgSample(0.05); this.pushEcgSample(0.95); this.pushEcgSample(0.5); }
    else if (kind === 'tool') { this.pushEcgSample(0.5); this.pushEcgSample(0.72); this.pushEcgSample(0.28); this.pushEcgSample(0.5); }
    else { this.pushEcgSample(0.5); this.pushEcgSample(0.62); this.pushEcgSample(0.38); this.pushEcgSample(0.5); }
  },

  addThoughtStep() {
    const steps = [
      { name: 'Perceive workspace changes', details: 'watchDir: /home/user/project' },
      { name: 'Build context from session', details: 'sessions: 3, messages: 1287' },
      { name: 'Call LLM — gpt-4o', details: 'model: gpt-4o, tokens: 2341' },
      { name: 'Parse response for tool calls', details: 'tokens: 156, tools: 2' },
      { name: 'Execute: readFile', details: 'path: src/index.ts' },
      { name: 'Execute: webSearch', details: 'query: latest API docs' },
      { name: 'Analyze search results', details: 'results: 5, relevant: 3' },
      { name: 'Generate code suggestion', details: 'lines: 47, language: typescript' },
      { name: 'Update memory store', details: 'key: project-context, ttl: 7d' },
      { name: 'Prepare response to user', details: 'confidence: 0.92' },
    ];
    const step = steps[this.thoughtId % steps.length];
    this.thoughtId++;
    const id = 'thought-' + this.thoughtId;
    this.thoughtSteps.push({ id, name: step.name, details: step.details, status: 'running', duration: 0, ts: Date.now() });
    this.ecgBeat('think');
    // Mark previous running as completed
    if (this.thoughtSteps.length > 1) {
      const prev = this.thoughtSteps[this.thoughtSteps.length - 2];
      if (prev.status === 'running') {
        prev.status = 'completed';
        prev.duration = Math.floor((Date.now() - prev.ts) / 100) / 10;
      }
    }
    // Occasionally mark a step as failed
    if (this.thoughtId % 7 === 0) {
      this.thoughtSteps[this.thoughtSteps.length - 1].status = 'failed';
      this.ecgBeat('fail');
    }
    // Prune
    if (this.thoughtSteps.length > 20) this.thoughtSteps.splice(0, this.thoughtSteps.length - 20);
    this.renderThoughtTimeline();
  },

  renderThoughtTimeline() {
    const el = document.getElementById('thoughtTimeline');
    if (!el) return;
    if (this.thoughtSteps.length === 0) { el.innerHTML = '<div class="thought-empty">' + mt('monitor.thoughtEmpty', '等待思考开始...') + '</div>'; return; }
    el.innerHTML = this.thoughtSteps.map(s => {
      const details = s.details || '';
      const statusText = s.status === 'running' ? mt('monitor.statusRunning', '运行中') : s.status === 'completed' ? mt('monitor.statusCompleted', '完成') : mt('monitor.statusFailed', '失败');
      return `<div class="thought-step ${s.status}"><div class="thought-step-content"><div class="thought-step-name">${s.name}</div>${details ? '<div class="thought-step-details">'+details+'</div>' : ''}<div class="thought-step-meta">${s.duration > 0 ? '<span class="thought-step-duration">'+s.duration+'s</span>' : ''}<span class="thought-step-status '+s.status+'">'+statusText+'</span></div></div></div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  },
};

// ============================================================
// Widget Renderers
// ============================================================
function formatNum(n) {
  const num = Number(n) || 0;
  if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return num.toString();
}
function formatTime(s) {
  const sec = Math.floor(Number(s) || 0);
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm';
  return Math.floor(sec / 3600) + 'h' + Math.floor((sec % 3600) / 60) + 'm';
}

// Stat Cards
function renderStatCards() {
  const d = MockData.statCards;
  const fields = [
    { key: 'todaySessions', labelKey: 'widget.todaySessions', unit: '' },
    { key: 'todayMessages', labelKey: 'widget.todayMessages', unit: '' },
    { key: 'todayToolCalls', labelKey: 'widget.todayToolCalls', unit: '' },
    { key: 'todayTokens', labelKey: 'widget.todayTokens', unit: '' },
    { key: 'totalTokens', labelKey: 'widget.totalTokens', unit: '' },
    { key: 'totalThinkingTime', labelKey: 'widget.thinkingTime', unit: 's', fmt: 'time' },
  ];
  const cards = fields.map(f => {
    const raw = d[f.key] || 0;
    const val = f.fmt === 'time' ? formatTime(raw) : formatNum(raw);
    return `<div class="stat-card"><div class="stat-card-label">${mt(f.labelKey, f.labelKey)}</div><div class="stat-card-value">${val}<span class="stat-card-unit">${f.unit}</span></div></div>`;
  }).join('');
  document.getElementById('widgetStatCards').innerHTML =
    `<div class="widget-card"><div class="widget-head"><span class="widget-head-mark">▸</span><span class="widget-head-label">TODAY METRICS</span><span class="widget-head-meta">${mt('widget.realtime', '实时')}</span></div><div class="stat-cards">${cards}</div></div>`;
}

// Token Rate
function renderTokenRate() {
  const s = MockData.tokenRate;
  const rate = s.samples.length < 2 ? 0 : (() => {
    const first = s.samples[0], last = s.samples[s.samples.length - 1];
    const dt = (last.t - first.t) / 1000;
    if (dt <= 0) return 0;
    return Math.round(s.samples.reduce((sum, sm) => sum + sm.count, 0) / dt);
  })();
  const hasData = s.samples.length >= 2;
  if (rate > s.maxRate) s.maxRate = Math.ceil(rate / 100) * 100;
  const pct = hasData ? Math.min(rate / s.maxRate, 1) : 0;
  const circumference = 2 * Math.PI * 42;
  const offset = circumference * (1 - pct);
  const ring = hasData
    ? `<div class="token-rate-ring"><svg viewBox="0 0 96 96"><circle class="ring-bg" cx="48" cy="48" r="42"/><circle class="ring-fg" cx="48" cy="48" r="42" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/></svg><div class="token-rate-center"><div class="token-rate-value">${rate}</div><div class="token-rate-unit">tok/s</div></div></div>`
    : `<div class="token-rate-ring" style="display:flex;align-items:center;justify-content:center;"><div class="token-rate-center"><div class="token-rate-value" style="font-size:12px;">--</div><div class="token-rate-unit">tok/s</div></div></div>`;
  document.getElementById('widgetTokenRate').innerHTML =
    `<div class="widget-card"><div class="widget-head"><span class="widget-head-mark">▸</span><span class="widget-head-label">TOKEN RATE</span><span class="widget-head-meta">5s 窗口</span></div><div class="token-rate-wrap">${ring}<div class="token-rate-stats"><div class="token-rate-row"><span class="token-rate-key">TODAY</span><span class="token-rate-val">${formatNum(s.totalToday)}</span></div><div class="token-rate-row"><span class="token-rate-key">TOTAL</span><span class="token-rate-val">${formatNum(s.totalAll)}</span></div><div class="token-rate-row"><span class="token-rate-key">PEAK</span><span class="token-rate-val">${formatNum(s.maxRate)}/s</span></div></div></div></div>`;
}

// ECG
function renderEcg() {
  const container = document.getElementById('widgetEcg');
  container.innerHTML =
    `<div class="widget-card"><div class="widget-head"><span class="widget-head-mark">▸</span><span class="widget-head-label">THINK ECG</span><span class="widget-head-meta">3s 心跳</span></div><div class="ecg-wrap"><canvas class="ecg-canvas"></canvas><div class="ecg-legend"><span class="ecg-legend-item"><span class="ecg-legend-dot"></span>THINK</span><span class="ecg-legend-item"><span class="ecg-legend-dot amber"></span>TOOL</span><span class="ecg-legend-item"><span class="ecg-legend-dot crimson"></span>FAIL</span></div></div></div>`;
  const canvas = container.querySelector('.ecg-canvas');
  const ctx = canvas.getContext('2d');
  const resize = () => {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    window._ecgW = rect.width;
    window._ecgH = rect.height;
  };
  resize();
  window.addEventListener('resize', resize);
  window._ecgCanvas = canvas;
  window._ecgCtx = ctx;
  window._ecgDraw = true;
}

function drawEcg() {
  if (!window._ecgCtx || !window._ecgDraw) return;
  const { width: w, height: h } = { width: window._ecgW || 300, height: window._ecgH || 80 };
  const ctx = window._ecgCtx;
  const data = MockData.ecgData;
  ctx.clearRect(0, 0, w, h);
  // Grid
  ctx.strokeStyle = 'rgba(180,200,230,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(180,200,230,0.08)';
  ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
  if (data.length < 2) return;
  const step = w / MockData.ecgMaxPoints;
  const centerY = h / 2;
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 6;
  ctx.shadowColor = 'rgba(94,234,212,0.6)';
  ctx.strokeStyle = '#5eead4';
  ctx.beginPath();
  data.forEach((pt, i) => {
    const x = i * step;
    const y = centerY - (pt.v - 0.5) * (h * 0.85);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;
  const lastPt = data[data.length - 1];
  if (lastPt) {
    const x = (data.length - 1) * step;
    const y = centerY - (lastPt.v - 0.5) * (h * 0.85);
    ctx.fillStyle = '#7ff5dd';
    ctx.shadowBlur = 8;
    ctx.shadowColor = 'rgba(94,234,212,0.8)';
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// Heatmap
function renderHeatmap() {
  const data = MockData.heatmapData;
  const metric = 'tokens';
  const values = data.map(d => Number(d[metric]) || 0);
  const positive = values.filter(v => v > 0).sort((a,b) => a-b);
  const thresholds = positive.length === 0 ? [1,10,100] : [
    Math.max(1, positive[Math.floor(positive.length*0.33)] || 1),
    Math.max(1, positive[Math.floor(positive.length*0.66)] || 10),
    Math.max(1, positive[Math.floor(positive.length*0.9)] || 100),
  ];
  const levelFor = (val) => { if (val <= 0) return 0; if (val < thresholds[0]) return 1; if (val < thresholds[1]) return 2; if (val < thresholds[2]) return 3; return 4; };
  const today = new Date();
  today.setHours(0,0,0,0);
  const startSunday = new Date(today);
  startSunday.setDate(today.getDate() - today.getDay() - 7 * 52);
  const cells = [];
  for (let w = 0; w < 53; w++) {
    for (let d = 0; d < 7; d++) {
      const date = new Date(startSunday);
      date.setDate(startSunday.getDate() + w * 7 + d);
      if (date > today) continue;
      const dateStr = date.toISOString().split('T')[0];
      const found = data.find(x => x.date === dateStr);
      const val = found ? Number(found[metric]) || 0 : 0;
      cells.push({ date: dateStr, val, level: levelFor(val) });
    }
  }
  const total = values.reduce((a,b) => a+b, 0);
  const hasData = values.some(v => v > 0);
  const grid = hasData ? `<div class="heatmap-grid">${cells.map(c => `<div class="heatmap-cell${c.level > 0 ? ' l'+c.level : ''}" title="${c.date}: ${c.val}"></div>`).join('')}</div><div class="heatmap-legend"><span>LESS</span><div class="heatmap-legend-cells"><div class="heatmap-cell"></div><div class="heatmap-cell l1"></div><div class="heatmap-cell l2"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div></div><span>MORE</span></div>` : '<div class="widget-empty">' + mt('widget.waitingData', '等待数据中...') + '</div>';
  document.getElementById('widgetHeatmap').innerHTML =
    `<div class="widget-card"><div class="widget-head"><span class="widget-head-mark">▸</span><span class="widget-head-label">ACTIVITY HEATMAP</span><span class="widget-head-meta">53 weeks · ${formatNum(total)}</span></div><div class="heatmap-wrap">${grid}</div></div>`;
}

// Tool Rank
function renderToolRank() {
  const top = MockData.toolRank;
  const maxCount = top.length > 0 ? top[0].callCount : 1;
  const items = top.map((t, idx) => {
    const pct = (t.callCount / maxCount) * 100;
    let barCls = '';
    if (t.successRate < 70) barCls = 'danger';
    else if (t.successRate < 90) barCls = 'warn';
    return `<div class="tool-rank-item"><span class="tool-rank-no">${String(idx+1).padStart(2,'0')}</span><span class="tool-rank-name" title="${t.toolName}">${t.toolName}</span><span class="tool-rank-count">${t.callCount}</span><div class="tool-rank-bar-wrap"><div class="tool-rank-bar ${barCls}" style="width:${pct}%"></div></div></div>`;
  }).join('');
  document.getElementById('widgetToolRank').innerHTML =
    `<div class="widget-card"><div class="widget-head"><span class="widget-head-mark">▸</span><span class="widget-head-label">TOOL RANKING</span><span class="widget-head-meta">TOP 3</span></div><div class="tool-rank-list">${items}</div></div>`;
}

// Tool Stats Chart (DETAIL)
function renderToolStats() {
  const ts = MockData.toolStats;
  const total = ts.calls.reduce((a,b) => a+b, 0);
  document.getElementById('statTotalCalls').textContent = total;
  const success = Math.round(ts.calls.reduce((a,c,i) => a + c * ts.rates[i] / 100, 0) / total * 100);
  document.getElementById('statSuccessRate').textContent = success + '%';
  const maxCall = Math.max(...ts.calls, 1);
  const chart = document.getElementById('toolUsageChart');
  chart.innerHTML = ts.categories.map((cat, i) => {
    const h = (ts.calls[i] / maxCall) * 100;
    const rate = ts.rates[i];
    const color = rate >= 90 ? 'rgba(94,234,212,'+(0.4 + (rate/100)*0.6)+')' : rate >= 70 ? 'rgba(251,191,36,'+(0.4 + (rate/100)*0.6)+')' : 'rgba(248,113,113,'+(0.4 + (rate/100)*0.6)+')';
    return `<div class="chart-bar"><div class="chart-bar-fill" style="height:${h}%;background:${color}"></div><div class="chart-bar-label">${cat}</div></div>`;
  }).join('');
}

// Agent Cluster (DETAIL)
function renderCluster() {
  const agents = MockData.agents;
  const canvas = document.getElementById('clusterTopologyCanvas');
  if (canvas) {
    const container = canvas.parentElement;
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const w = rect.width, h = rect.height, cx = w/2, cy = h/2;
    ctx.clearRect(0, 0, w, h);
    if (agents.length > 0) {
      const radius = Math.min(w, h) * 0.3;
      const nodes = agents.map((a, i) => {
        const angle = (i / agents.length) * 2 * Math.PI - Math.PI / 2;
        return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle), label: a.name, state: a.state };
      });
      ctx.strokeStyle = 'rgba(99,102,241,0.3)';
      ctx.lineWidth = 1.5;
      for (const node of nodes) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(node.x, node.y); ctx.stroke(); }
      // Draw center node
      const drawNode = (x, y, label, state, size) => {
        const colors = { idle:'#6b7280', thinking:'#6366f1', tool_executing:'#f59e0b', done:'#10b981', error:'#f87171', center:'#6366f1' };
        const color = colors[state] || '#6b7280';
        const grad = ctx.createRadialGradient(x,y,0,x,y,size*1.5);
        grad.addColorStop(0, color+'40');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(x, y, size*1.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, size/2, 0, Math.PI*2);
        ctx.fillStyle = color; ctx.fill();
        if (state !== 'center') { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); }
        ctx.fillStyle = '#e5e7eb';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(label, x, y + size/2 + 4);
      };
      drawNode(cx, cy, mt('monitor.mainAgent', '主智能体'), 'center', 28);
      for (const node of nodes) drawNode(node.x, node.y, node.label, node.state, 20);
      // Pulse animation
      const now = Date.now();
      for (const node of nodes) {
        if (node.state === 'thinking' || node.state === 'tool_executing') {
          const pulse = Math.sin(now / 500) * 0.3 + 0.7;
          ctx.beginPath();
          ctx.arc(node.x, node.y, 24, 0, Math.PI*2);
          ctx.fillStyle = node.state === 'thinking' ? `rgba(99,102,241,${pulse*0.3})` : `rgba(245,158,11,${pulse*0.3})`;
          ctx.fill();
        }
      }
    }
  }
  const stateIcons = { idle:'💤', thinking:'🧠', tool_executing:'🛠️', done:'✅', error:'❌' };
  const list = document.getElementById('clusterList');
  list.innerHTML = agents.map(a => {
    const icon = stateIcons[a.state] || '🤖';
    const timeAgo = Math.round((Date.now() - a.lastActiveAt) / 1000);
    const timeStr = timeAgo < 60 ? mt('monitor.secondsAgo', timeAgo + '秒前', { n: timeAgo }) : mt('monitor.minutesAgo', Math.round(timeAgo/60) + '分钟前', { n: Math.round(timeAgo/60) });
    return `<div class="cluster-agent-card"><div class="cluster-agent-header"><span class="cluster-agent-name">${icon} ${a.name}</span><span class="cluster-agent-state ${a.state}">${a.state}</span></div><div class="cluster-agent-details"><span class="cluster-agent-detail"><span class="cluster-agent-detail-label">Persona:</span><span class="cluster-agent-detail-value">${a.persona}</span></span><span class="cluster-agent-detail"><span class="cluster-agent-detail-label">${mt('monitor.tools', '工具')}:</span><span class="cluster-agent-detail-value">${a.toolCalls}</span></span><span class="cluster-agent-detail"><span class="cluster-agent-detail-label">${mt('monitor.iterations', '迭代')}:</span><span class="cluster-agent-detail-value">${a.iterationCount}</span></span></div><div style="font-size:10px;color:var(--type-faint);display:flex;justify-content:space-between;"><span>ID: ${a.id}</span><span>${timeStr}</span></div></div>`;
  }).join('');
}

// ============================================================
// Tab Switching
// ============================================================
function initTabs() {
  const tabs = document.querySelectorAll('.widget-tab[data-pane]');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const targetId = tab.dataset.pane;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.overview-pane, .detail-pane').forEach(p => p.style.display = 'none');
      const target = document.getElementById(targetId);
      if (target) target.style.display = '';
      // Re-render cluster topology when switching to detail
      if (targetId === 'detailPane') setTimeout(renderCluster, 100);
    });
  });
}

// ============================================================
// Panel Toggle
// ============================================================
function initPanelToggle() {
  const toggles = [
    { btn: 'toggleThoughtPanel', body: 'thoughtPanelBody' },
    { btn: 'toggleStatsPanel', body: 'statsPanelBody' },
    { btn: 'toggleClusterPanel', body: 'clusterPanelBody' },
  ];
  toggles.forEach(({btn, body}) => {
    const el = document.getElementById(btn);
    const bodyEl = document.getElementById(body);
    if (el && bodyEl) {
      el.addEventListener('click', () => bodyEl.classList.toggle('collapsed'));
    }
  });
}

// ============================================================
// Mock Data Simulation
// ============================================================
function initMockData() {
  // Generate initial heatmap data
  MockData.heatmapData = MockData.generateHeatmap();

  // Initial render
  renderStatCards();
  renderTokenRate();
  renderEcg();
  renderHeatmap();
  renderToolRank();
  renderToolStats();
  renderCluster();

  // Seed ECG with initial data
  for (let i = 0; i < 60; i++) {
    MockData.pushEcgSample(Math.random() * 0.3 + 0.35);
  }

  // Seed token rate samples
  for (let i = 0; i < 10; i++) {
    MockData.tokenRate.samples.push({ t: Date.now() - (10 - i) * 500, count: Math.floor(Math.random() * 80) + 20 });
  }

  // ECG decay loop
  setInterval(() => {
    if (MockData.ecgData.length === 0) {
      MockData.pushEcgSample(0.5);
    } else {
      const last = MockData.ecgData[MockData.ecgData.length - 1];
      if (Date.now() - last.t > 300) MockData.pushEcgSample(0.5);
    }
    drawEcg();
  }, 250);

  // Think cycle: every 3 seconds
  setInterval(() => {
    MockData.addThoughtStep();
    renderToolStats();
    // Randomly update agent states
    const agents = MockData.agents;
    const states = ['idle', 'thinking', 'tool_executing', 'done'];
    const idx = Math.floor(Math.random() * agents.length);
    agents[idx].state = states[Math.floor(Math.random() * states.length)];
    agents[idx].toolCalls += Math.floor(Math.random() * 3);
    agents[idx].iterationCount += Math.floor(Math.random() * 2);
    agents[idx].lastActiveAt = Date.now();
    setTimeout(renderCluster, 100);

    // Update stat cards with slight increments
    MockData.statCards.todayMessages += Math.floor(Math.random() * 5);
    MockData.statCards.todayToolCalls += Math.floor(Math.random() * 3);
    MockData.statCards.todayTokens += Math.floor(Math.random() * 100) + 50;
    MockData.statCards.totalTokens += Math.floor(Math.random() * 100) + 50;
    MockData.statCards.totalThinkingTime += 3;

    // Token rate samples
    MockData.tokenRate.samples.push({ t: Date.now(), count: Math.floor(Math.random() * 60) + 40 });
    const cutoff = Date.now() - 5000;
    MockData.tokenRate.samples = MockData.tokenRate.samples.filter(s => s.t >= cutoff);
    MockData.tokenRate.totalToday = MockData.statCards.todayTokens;
    MockData.tokenRate.totalAll = MockData.statCards.totalTokens;

    renderStatCards();
    renderTokenRate();
    renderToolRank();
  }, 3000);

  // Random tool beat
  setInterval(() => {
    if (Math.random() < 0.4) {
      MockData.ecgBeat('tool');
      // Add a thought step for tool execution
      MockData.addThoughtStep();
    }
  }, 5000);
}

// ============================================================
// Init
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  initTabs();
  initPanelToggle();
  initMockData();
});

document.addEventListener('cogito:langchange', () => {
  if (window.I18n) window.I18n.apply();
  if (window.MockData) {
    renderStatCards();
    renderToolStats();
    renderCluster();
    if (typeof MockData.renderThoughtTimeline === 'function') MockData.renderThoughtTimeline();
  }
});
</script>
